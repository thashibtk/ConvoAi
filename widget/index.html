<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Widget Test Page</title>
    <!-- Add Inter font for testing -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .test-card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        max-width: 600px;
        text-align: center;
      }
      h1 { color: #111827; }
      p { color: #6b7280; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="test-card">
      <h1>This is your client's website</h1>
      <p>The AI Chatbot widget should be floating in the bottom right corner of the screen. Try clicking the purple bubble to open it up!</p>
    </div>

    <!-- Inject the widget for local testing -->
    <script type="module" src="/src/main.ts" data-site-id="test-site-id"></script>
  </body>
</html>
